name: Release

# Runs when you push a tag like v0.5.0. It builds CoachLink-<version>.zip
# and publishes it on the GitHub Releases page. When CurseForge is set up (see
# docs/curseforge.md), it also uploads the same zip there.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches the addon version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          toc_version="$(sed -n 's/^## Version:[[:space:]]*//p' addon/CoachLink/CoachLink.toc | tr -d '\r')"
          echo "tag: $tag_version, CoachLink.toc: $toc_version"
          if [ "$tag_version" != "$toc_version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version in CoachLink.toc." >&2
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Build the zip (folder CoachLink/ at the root)
        run: |
          cd addon
          zip -r "../CoachLink-${VERSION}.zip" CoachLink

      - name: Take this version's notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for $VERSION in CHANGELOG.md." >&2
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "CoachLink-${VERSION}.zip" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      # Optional: the same zip on CurseForge. It runs only after the owner set the repository
      # variables CURSEFORGE_PROJECT_ID and CURSEFORGE_GAME_VERSIONS and the secret
      # CF_API_TOKEN (docs/curseforge.md). The token only travels in an environment variable.
      - name: Upload to CurseForge (when it is set up)
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          GAME_VERSIONS: ${{ vars.CURSEFORGE_GAME_VERSIONS }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$GAME_VERSIONS" ]; then
            echo "CurseForge is only half set up (token or game versions missing): skipping."
            exit 0
          fi
          python3 - <<'PY' > metadata.json
          import json
          import os

          ids = [int(part) for part in os.environ["GAME_VERSIONS"].split(",") if part.strip()]
          with open("release-notes.md", encoding="utf-8") as notes:
              changelog = notes.read()
          print(json.dumps({
              "changelog": changelog,
              "changelogType": "markdown",
              "displayName": f"CoachLink {os.environ['VERSION']}",
              "gameVersions": ids,
              "releaseType": "release",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CF_API_TOKEN}" \
            --form "metadata=<metadata.json" \
            --form "file=@CoachLink-${VERSION}.zip" \
            "https://wow.curseforge.com/api/projects/${PROJECT_ID}/upload-file"
